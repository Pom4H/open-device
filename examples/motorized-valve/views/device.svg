<svg viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Motor-operated gate valve" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <filter id="od-mov-soft" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity=".35"/></filter>
    <linearGradient id="od-mov-actuator" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f4c60"/><stop offset="1" stop-color="#28313f"/>
    </linearGradient>
    <linearGradient id="od-mov-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8b6c8"/><stop offset=".5" stop-color="#7c8a9c"/><stop offset="1" stop-color="#5d6b7d"/>
    </linearGradient>
  </defs>

  <!-- actuator -->
  <g filter="url(#od-mov-soft)">
    <rect x="60" y="18" width="100" height="86" rx="10" fill="url(#od-mov-actuator)" stroke="#10161f" stroke-width="1.4"/>
  </g>
  <ellipse cx="110" cy="18" rx="26" ry="8" fill="#4a586e" stroke="#10161f" stroke-width="1"/>
  <rect x="80" y="34" width="60" height="22" rx="4" fill="#0b1220" stroke="#3c4a61"/>
  <text data-valve-position="" x="110" y="49" text-anchor="middle" font-size="9" font-weight="700" font-family="ui-monospace, monospace" fill="#f2c94c">CLOSED</text>
  <circle data-valve-led-open="" cx="86" cy="68" r="3.4" fill="#1d3524" stroke="#0f1c14"/>
  <text x="93" y="71" font-size="6.5" fill="#9fb0c6">OPEN</text>
  <circle data-valve-led-closed="" cx="120" cy="68" r="3.4" fill="#6b5c1c" stroke="#3d3413"/>
  <text x="127" y="71" font-size="6.5" fill="#9fb0c6">CLOSED</text>
  <text x="110" y="94" text-anchor="middle" font-size="7.5" font-weight="700" fill="#cbd5e1">MOV-90 actuator</text>

  <!-- signal terminals -->
  <g font-size="6" font-weight="700" fill="#9fb0c6">
    <rect x="2" y="46" width="12" height="12" rx="2" fill="#245b34" stroke="#0f1c14"/>
    <text x="18" y="55">OPEN</text>
    <rect x="2" y="78" width="12" height="12" rx="2" fill="#5b2429" stroke="#230d0f"/>
    <text x="18" y="87">CLOSE</text>
    <rect x="206" y="46" width="12" height="12" rx="2" fill="#245b34" stroke="#0f1c14"/>
    <text x="202" y="55" text-anchor="end">LS-O</text>
    <rect x="206" y="78" width="12" height="12" rx="2" fill="#6b5c1c" stroke="#3d3413"/>
    <text x="202" y="87" text-anchor="end">LS-C</text>
  </g>

  <!-- yoke / stem -->
  <rect x="102" y="104" width="16" height="38" fill="#4b5563" stroke="#1f2733"/>
  <rect x="96" y="118" width="28" height="8" rx="2" fill="#39455a"/>

  <!-- valve body -->
  <g filter="url(#od-mov-soft)">
    <path d="M62 164 L108 190 L62 220 Z" fill="url(#od-mov-steel)" stroke="#333f4f" stroke-width="1.4"/>
    <path d="M158 164 L112 190 L158 220 Z" fill="url(#od-mov-steel)" stroke="#333f4f" stroke-width="1.4"/>
    <circle data-valve-disc="" cx="110" cy="190" r="10" fill="#39455a" stroke="#10161f"/>
  </g>
  <!-- flanges -->
  <g fill="#5d6b7d" stroke="#333f4f" stroke-width="1.2">
    <rect x="48" y="158" width="12" height="68" rx="2"/>
    <rect x="160" y="158" width="12" height="68" rx="2"/>
  </g>
  <g stroke="#2c3644" stroke-width="1.6">
    <line x1="54" y1="166" x2="54" y2="218"/><line x1="166" y1="166" x2="166" y2="218"/>
  </g>
  <!-- pipe stubs -->
  <rect x="8" y="183" width="40" height="20" fill="#475569" stroke="#28313f"/>
  <rect x="172" y="183" width="40" height="20" fill="#475569" stroke="#28313f"/>

  <text x="110" y="236" text-anchor="middle" font-size="7.5" fill="#94a3b8">XV · gate valve DN80 · PN16</text>
</svg>
