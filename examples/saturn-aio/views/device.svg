<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Saturn-AIO analog expansion module" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <filter id="od-aio-soft" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".16"/></filter>
    <clipPath id="od-aio-x1"><rect x="24" y="12" width="96" height="26" rx="4"/></clipPath>
    <clipPath id="od-aio-x2"><rect x="232" y="12" width="64" height="26" rx="4"/></clipPath>
    <clipPath id="od-aio-x3"><rect x="24" y="162" width="52" height="26" rx="4"/></clipPath>
    <clipPath id="od-aio-x4"><rect x="84" y="162" width="160" height="26" rx="4"/></clipPath>
    <clipPath id="od-aio-x5"><rect x="252" y="162" width="44" height="26" rx="4"/></clipPath>
  </defs>

  <g filter="url(#od-aio-soft)"><rect x="8" y="24" width="304" height="172" rx="14" fill="#eef1f5" stroke="#b7c0cc" stroke-width="1.4"/></g>

  <!-- X1 · analog outputs -->
  <g clip-path="url(#od-aio-x1)">
