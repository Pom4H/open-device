  <g text-anchor="middle" font-weight="700" font-size="9" font-family="ui-monospace, monospace" fill="#0e1f3c">
    <text x="252" y="35">−</text><text x="276" y="35">+</text>
  </g>
  <rect x="247.5" y="6" width="9" height="9" rx="1.5" fill="#6b7684" stroke="#4f5d6b" stroke-width=".5"/>
  <rect x="271.5" y="6" width="9" height="9" rx="1.5" fill="#6b7684" stroke="#4f5d6b" stroke-width=".5"/>
  <text x="264" y="52" text-anchor="middle" font-weight="700" font-size="9" fill="#475569">X2</text>

  <!-- face -->
  <rect x="18" y="60" width="284" height="88" rx="6" fill="#eceff4" stroke="#c5cdd8" stroke-width="1.2"/>
