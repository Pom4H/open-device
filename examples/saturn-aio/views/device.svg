  <text x="30" y="97" font-size="16" font-weight="700" fill="#0f172a">Saturn-AIO</text>
  <rect x="30" y="104" width="11" height="11" rx="2" fill="#00307c"/>
  <text x="35.5" y="112.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">S</text>
  <text x="46" y="113" font-size="8" font-weight="700" fill="#1e3a8a">МНПП Сатурн</text>
