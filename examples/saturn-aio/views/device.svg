  <rect x="252" y="162" width="44" height="26" rx="4" fill="none" stroke="#000000" stroke-opacity=".28"/>
  <g text-anchor="middle" font-weight="700" font-size="7" fill="#0e1f3c" font-family="ui-monospace, monospace">
    <text x="263" y="172">⊥</text><text x="285" y="172">⊥</text>
  </g>
  <rect x="258.5" y="183" width="9" height="9" rx="1.5" fill="#6b7684" stroke="#4f5d6b" stroke-width=".5"/>
  <rect x="280.5" y="183" width="9" height="9" rx="1.5" fill="#6b7684" stroke="#4f5d6b" stroke-width=".5"/>
</svg>
