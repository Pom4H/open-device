    <line x1="164" y1="162" x2="164" y2="188" stroke="#000000" stroke-opacity=".14" stroke-width=".5"/>
    <line x1="204" y1="162" x2="204" y2="188" stroke="#000000" stroke-opacity=".14" stroke-width=".5"/>
  </g>
  <rect x="84" y="162" width="160" height="26" rx="4" fill="none" stroke="#000000" stroke-opacity=".28"/>
  <g text-anchor="middle" font-weight="700" font-size="7" fill="#0e1f3c" font-family="ui-monospace, monospace">
    <text x="104" y="172">1</text><text x="144" y="172">2</text><text x="184" y="172">3</text><text x="224" y="172">4</text>
  </g>
  <g fill="#eef2f7" stroke="#243044" stroke-width="1.2">
    <rect class="saturn-terminal-pin" data-terminal-id="ai1" x="99.5" y="183" width="9" height="9" rx="1.5"/>
    <rect class="saturn-terminal-pin" data-terminal-id="ai2" x="139.5" y="183" width="9" height="9" rx="1.5"/>
    <rect class="saturn-terminal-pin" data-terminal-id="ai3" x="179.5" y="183" width="9" height="9" rx="1.5"/>
    <rect class="saturn-terminal-pin" data-terminal-id="ai4" x="219.5" y="183" width="9" height="9" rx="1.5"/>
  </g>

