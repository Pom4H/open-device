    <rect x="24" y="25" width="96" height="13" fill="#d4b02a"/>
    <line x1="72" y1="12" x2="72" y2="38" stroke="#000000" stroke-opacity=".14" stroke-width=".5"/>
  </g>
  <rect x="24" y="12" width="96" height="26" rx="4" fill="none" stroke="#000000" stroke-opacity=".28"/>
  <g text-anchor="middle" font-weight="700" font-size="7.5" fill="#0e1f3c">
    <text x="48" y="34">AO1</text><text x="96" y="34">AO2</text>
  </g>
  <rect class="saturn-terminal-pin" data-terminal-id="ao1" x="43.5" y="6" width="9" height="9" rx="1.5" fill="#eef2f7" stroke="#243044" stroke-width="1.2"/>
  <rect class="saturn-terminal-pin" data-terminal-id="ao2" x="91.5" y="6" width="9" height="9" rx="1.5" fill="#eef2f7" stroke="#243044" stroke-width="1.2"/>
  <text x="72" y="52" text-anchor="middle" font-weight="700" font-size="9" fill="#475569">X1 · AO</text>

  <!-- X2 · power -->
  <g clip-path="url(#od-aio-x2)">
    <rect x="232" y="12" width="64" height="13" fill="#fde68a"/>
    <rect x="232" y="25" width="64" height="13" fill="#d4b02a"/>
