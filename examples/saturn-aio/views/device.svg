  </g>
  <text x="216" y="104" font-size="6.5" fill="#64748b">AO</text>
  <g stroke="#3d3413" stroke-width=".6">
    <circle data-ao-led="1" cx="230" cy="102" r="2.8" fill="#3a3413"/><circle data-ao-led="2" cx="240" cy="102" r="2.8" fill="#3a3413"/>
