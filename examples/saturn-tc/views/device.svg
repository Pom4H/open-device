<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Saturn-TC temperature expansion module" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <filter id="od-tc-soft" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".16"/></filter>
    <clipPath id="od-tc-x1"><rect x="232" y="12" width="64" height="26" rx="4"/></clipPath>
    <clipPath id="od-tc-x2"><rect x="24" y="162" width="52" height="26" rx="4"/></clipPath>
    <clipPath id="od-tc-x3"><rect x="84" y="162" width="212" height="26" rx="4"/></clipPath>
  </defs>

  <g filter="url(#od-tc-soft)"><rect x="8" y="24" width="304" height="172" rx="14" fill="#eef1f5" stroke="#b7c0cc" stroke-width="1.4"/></g>

  <!-- X1 · power -->
  <g clip-path="url(#od-tc-x1)">
    <rect x="232" y="12" width="64" height="13" fill="#fde68a"/>
    <rect x="232" y="25" width="64" height="13" fill="#d4b02a"/>
  </g>
  <rect x="232" y="12" width="64" height="26" rx="4" fill="none" stroke="#000000" stroke-opacity=".28"/>
  <text x="264" y="21.5" text-anchor="middle" font-weight="700" font-size="7" fill="#0e1f3c">DC 12-24V</text>
  <g text-anchor="middle" font-weight="700" font-size="9" font-family="ui-monospace, monospace" fill="#0e1f3c">
    <text x="252" y="35">−</text><text x="276" y="35">+</text>
  </g>
  <rect x="247.5" y="6" width="9" height="9" rx="1.5" fill="#6b7684" stroke="#4f5d6b" stroke-width=".5"/>
  <rect x="271.5" y="6" width="9" height="9" rx="1.5" fill="#6b7684" stroke="#4f5d6b" stroke-width=".5"/>
  <text x="264" y="52" text-anchor="middle" font-weight="700" font-size="9" fill="#475569">X1</text>

  <!-- face -->
  <rect x="18" y="60" width="284" height="88" rx="6" fill="#eceff4" stroke="#c5cdd8" stroke-width="1.2"/>
  <text x="30" y="78" font-size="8.5" fill="#475569">Температурный модуль</text>
  <text x="30" y="97" font-size="16" font-weight="700" fill="#0f172a">Saturn-TC</text>
  <rect x="30" y="104" width="11" height="11" rx="2" fill="#00307c"/>
  <text x="35.5" y="112.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">S</text>
  <text x="46" y="113" font-size="8" font-weight="700" fill="#1e3a8a">МНПП Сатурн</text>
  <text x="30" y="131" font-size="7.5" fill="#64748b">RS-485 · Modbus RTU</text>
  <text x="30" y="142" font-size="7.5" fill="#64748b">6 каналов · Pt1000 / NTC</text>
  <text x="164" y="143" font-size="11" font-weight="700" fill="#6b7684">EAC</text>

  <!-- status panel -->
  <rect x="206" y="70" width="86" height="68" rx="6" fill="#10161f" stroke="#2b3442"/>
  <text x="216" y="84" font-size="6.5" fill="#64748b">T</text>
  <g stroke="#2c2338" stroke-width=".6">
    <circle data-t-led="1" cx="228" cy="82" r="2.8" fill="#2c2340"/><circle data-t-led="2" cx="238" cy="82" r="2.8" fill="#2c2340"/><circle data-t-led="3" cx="248" cy="82" r="2.8" fill="#2c2340"/><circle data-t-led="4" cx="258" cy="82" r="2.8" fill="#2c2340"/><circle data-t-led="5" cx="268" cy="82" r="2.8" fill="#2c2340"/><circle data-t-led="6" cx="278" cy="82" r="2.8" fill="#2c2340"/>
  </g>
  <text x="216" y="106" font-size="6.5" fill="#64748b">°C</text>
  <text data-tc-readout="" x="252" y="108" text-anchor="middle" font-size="11" font-weight="700" font-family="ui-monospace, monospace" fill="#c4a8e8">— — —</text>
  <circle cx="220" cy="124" r="2.8" fill="#42d77d" stroke="#1d3524" stroke-width=".6"/>
  <text x="227" y="127" font-size="6" fill="#94a3b8">RUN</text>
  <circle class="od-led-bus" cx="252" cy="124" r="2.8" fill="#f2c94c" stroke="#3d3413" stroke-width=".6"/>
  <text x="259" y="127" font-size="6" fill="#94a3b8">BUS</text>

  <!-- X2 · RS-485 -->
  <text x="50" y="158" text-anchor="middle" font-weight="700" font-size="9" fill="#475569">X2</text>
  <g clip-path="url(#od-tc-x2)">
    <rect x="24" y="162" width="52" height="13" fill="#9ed8f7"/>
    <rect x="24" y="175" width="52" height="13" fill="#5eb0e0"/>
  </g>
  <rect x="24" y="162" width="52" height="26" rx="4" fill="none" stroke="#000000" stroke-opacity=".28"/>
  <text x="50" y="171" text-anchor="middle" font-weight="700" font-size="7" fill="#0e1f3c">RS 485</text>
  <g text-anchor="middle" font-weight="700" font-size="7" fill="#ffffff" font-family="ui-monospace, monospace">
    <text x="40" y="181.5">A</text><text x="64" y="181.5">B</text>
  </g>
  <rect class="saturn-terminal-pin" data-terminal-id="rs485" x="35.5" y="183" width="9" height="9" rx="1.5" fill="#eef2f7" stroke="#243044" stroke-width="1.2"/>
  <rect x="59.5" y="183" width="9" height="9" rx="1.5" fill="#eef2f7" stroke="#243044" stroke-width="1.2"/>

  <!-- X3 · temperature channels -->
  <text x="190" y="158" text-anchor="middle" font-weight="700" font-size="9" fill="#475569">X3 · Pt / NTC</text>
  <g clip-path="url(#od-tc-x3)">
    <rect x="84" y="162" width="212" height="13" fill="#c4a8e8"/>
    <rect x="84" y="175" width="212" height="13" fill="#8b6cc4"/>
    <line x1="119.5" y1="162" x2="119.5" y2="188" stroke="#000000" stroke-opacity=".14" stroke-width=".5"/>
    <line x1="154.5" y1="162" x2="154.5" y2="188" stroke="#000000" stroke-opacity=".14" stroke-width=".5"/>
    <line x1="189.5" y1="162" x2="189.5" y2="188" stroke="#000000" stroke-opacity=".14" stroke-width=".5"/>
    <line x1="224.5" y1="162" x2="224.5" y2="188" stroke="#000000" stroke-opacity=".14" stroke-width=".5"/>
    <line x1="259.5" y1="162" x2="259.5" y2="188" stroke="#000000" stroke-opacity=".14" stroke-width=".5"/>
  </g>
  <rect x="84" y="162" width="212" height="26" rx="4" fill="none" stroke="#000000" stroke-opacity=".28"/>
  <g text-anchor="middle" font-weight="700" font-size="7" fill="#0e1f3c">
    <text x="102" y="172">T1</text><text x="137" y="172">T2</text><text x="172" y="172">T3</text><text x="207" y="172">T4</text><text x="242" y="172">T5</text><text x="277" y="172">T6</text>
  </g>
  <g fill="#eef2f7" stroke="#243044" stroke-width="1.2">
    <rect class="saturn-terminal-pin" data-terminal-id="t1" x="97.5" y="183" width="9" height="9" rx="1.5"/>
    <rect class="saturn-terminal-pin" data-terminal-id="t2" x="132.5" y="183" width="9" height="9" rx="1.5"/>
    <rect class="saturn-terminal-pin" data-terminal-id="t3" x="167.5" y="183" width="9" height="9" rx="1.5"/>
    <rect class="saturn-terminal-pin" data-terminal-id="t4" x="202.5" y="183" width="9" height="9" rx="1.5"/>
    <rect class="saturn-terminal-pin" data-terminal-id="t5" x="237.5" y="183" width="9" height="9" rx="1.5"/>
    <rect class="saturn-terminal-pin" data-terminal-id="t6" x="272.5" y="183" width="9" height="9" rx="1.5"/>
  </g>
</svg>
