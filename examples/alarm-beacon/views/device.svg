<svg viewBox="0 0 170 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Signal tower with sounder" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <filter id="od-ab-soft" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity=".35"/></filter>
  </defs>

  <!-- sounder cap -->
  <g filter="url(#od-ab-soft)">
    <rect x="66" y="34" width="38" height="26" rx="7" fill="#1f2937" stroke="#10161f" stroke-width="1.2"/>
  </g>
  <g stroke="#0b1220" stroke-width="1.4">
    <line x1="72" y1="42" x2="98" y2="42"/><line x1="72" y1="48" x2="98" y2="48"/><line x1="72" y1="54" x2="98" y2="54"/>
  </g>
  <!-- sound waves (visible when alarm active) -->
  <g data-beacon-waves="" stroke="#f87171" stroke-width="2" fill="none" opacity="0">
    <path d="M58 36 q-8 11 0 22"/><path d="M48 30 q-13 17 0 34"/>
    <path d="M112 36 q8 11 0 22"/><path d="M122 30 q13 17 0 34"/>
  </g>

  <!-- red segment -->
  <g filter="url(#od-ab-soft)">
    <rect data-beacon-red="" x="62" y="64" width="46" height="34" rx="6" fill="#7f1d1d" stroke="#10161f" stroke-width="1.2"/>
  </g>
  <g stroke="#ffffff" stroke-opacity=".12" stroke-width="2">
    <line x1="74" y1="66" x2="74" y2="96"/><line x1="85" y1="66" x2="85" y2="96"/><line x1="96" y1="66" x2="96" y2="96"/>
  </g>

  <!-- amber segment -->
  <rect data-beacon-amber="" x="62" y="100" width="46" height="34" rx="6" fill="#713f12" stroke="#10161f" stroke-width="1.2"/>
  <g stroke="#ffffff" stroke-opacity=".12" stroke-width="2">
    <line x1="74" y1="102" x2="74" y2="132"/><line x1="85" y1="102" x2="85" y2="132"/><line x1="96" y1="102" x2="96" y2="132"/>
  </g>

  <!-- green segment -->
  <rect data-beacon-green="" x="62" y="136" width="46" height="34" rx="6" fill="#14532d" stroke="#10161f" stroke-width="1.2"/>
  <g stroke="#ffffff" stroke-opacity=".12" stroke-width="2">
    <line x1="74" y1="138" x2="74" y2="168"/><line x1="85" y1="138" x2="85" y2="168"/><line x1="96" y1="138" x2="96" y2="168"/>
  </g>

  <!-- signal terminal -->
  <rect x="2" y="114" width="12" height="12" rx="2" fill="#5b2429" stroke="#230d0f"/>
  <text x="18" y="123" font-size="6" font-weight="700" fill="#9fb0c6">ALM</text>

  <!-- pole and base -->
  <rect x="80" y="170" width="10" height="26" fill="#4b5563" stroke="#1f2733"/>
  <g filter="url(#od-ab-soft)">
    <rect x="55" y="196" width="60" height="18" rx="4" fill="#334155" stroke="#10161f" stroke-width="1.2"/>
  </g>

  <text x="85" y="230" text-anchor="middle" font-size="7.5" fill="#94a3b8">HA · signal tower 24 VDC</text>
</svg>
