<svg viewBox="0 0 190 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hydrostatic level transmitter" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <filter id="od-lt-soft" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity=".35"/></filter>
    <linearGradient id="od-lt-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f4c60"/><stop offset="1" stop-color="#28313f"/>
    </linearGradient>
  </defs>

  <!-- cable gland -->
  <rect x="87" y="6" width="16" height="16" rx="3" fill="#4b5563" stroke="#1f2733"/>

  <!-- head -->
  <g filter="url(#od-lt-soft)">
    <rect x="52" y="20" width="86" height="66" rx="10" fill="url(#od-lt-head)" stroke="#10161f" stroke-width="1.4"/>
  </g>
  <rect x="62" y="32" width="66" height="28" rx="4" fill="#0b1220" stroke="#3c4a61"/>
  <text data-level-value="" x="112" y="52" text-anchor="end" font-size="14" font-weight="700" font-family="ui-monospace, monospace" fill="#a5f3fc">—</text>
  <text x="117" y="52" font-size="7" fill="#64748b">%</text>
  <text x="95" y="76" text-anchor="middle" font-size="7" fill="#7b8aa0" letter-spacing="1">REF LEVELSONDE</text>

  <!-- signal terminal -->
  <rect x="176" y="40" width="12" height="12" rx="2" fill="#6b5c1c" stroke="#3d3413"/>
  <text x="172" y="49" text-anchor="end" font-size="6" font-weight="700" fill="#9fb0c6">4-20</text>

  <!-- probe -->
  <rect x="91" y="86" width="8" height="106" fill="#7c8a9c" stroke="#333f4f"/>
  <g stroke="#333f4f" stroke-width="1">
    <line x1="91" y1="110" x2="99" y2="110"/><line x1="91" y1="134" x2="99" y2="134"/><line x1="91" y1="158" x2="99" y2="158"/>
  </g>
  <!-- water hint -->
  <g stroke="#155e75" stroke-width="2" fill="none" opacity=".55">
    <path d="M40 168 q8 -6 16 0 t16 0"/>
    <path d="M118 168 q8 -6 16 0 t16 0"/>
    <path d="M52 182 q8 -6 16 0 t16 0"/>
    <path d="M106 182 q8 -6 16 0 t16 0"/>
  </g>
  <!-- sensor tip -->
  <rect x="84" y="192" width="22" height="16" rx="5" fill="#39455a" stroke="#10161f"/>
  <circle cx="95" cy="200" r="3" fill="#a5f3fc" opacity=".7"/>

  <text x="95" y="218" text-anchor="middle" font-size="7" fill="#94a3b8">LIT · hydrostatic probe 0–10 m</text>
</svg>
